<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)" />
    <!-- Applies the theme before first paint; see src/lib/theme.ts, which owns the key. -->
    <script>
      (function () {
        var theme = null
        try { theme = localStorage.getItem('new-api:web-custom:theme') } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <!-- Replaced at runtime by the operator's configured logo; see AppProviders. -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>Console</title>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
